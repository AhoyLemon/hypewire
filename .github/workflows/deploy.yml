name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
    # The poster commits tomorrow's schedule to main every day, which changes nothing on the site.
    paths-ignore:
      - ".github/workflows/post-bluesky.yml"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 🛒 Checkout source Git branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: 📦 Install dependencies
        run: bun ci

      - name: 🔨 Build site
        run: bun run build

      # Only the built site goes up, never node_modules or the source.
      - name: 📁 Stage the built site for deploy
        run: |
          mkdir -p _site/js
          cp index.html _site/
          cp -r css _site/css
          cp -r js/min _site/js/min
          cp -r src/svg _site/svg
          cp -r src/img _site/img

      - name: 🔍 Check for testing mode or localhost
        run: |
          if grep -r -q "localhost" --include="*.html" _site; then
            echo "🚫 Deployment blocked:'localhost' found in html."
            exit 1
          fi

      - name: 🧑‍🔧 Setup Pages
        uses: actions/configure-pages@v6
      - name: 📤 Uploading artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site"
      - name: 🚢 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: 🫠 This job's status is ${{ job.status }}.
        run: echo "🫠 This job's status is ${{ job.status }}."
      - name: 🌐 Deployed to ${{ steps.deployment.outputs.page_url }}.
        run: echo "🌐 Deployed to ${{ steps.deployment.outputs.page_url }}."

name: Post to BlueSky

on:
  schedule:
    # Four posts a day, around the clock. The 2am hour is skipped, so daylight saving never drops or doubles a slot.
    - cron: "23 3,9,15,21 * * *"
      timezone: "America/Chicago"
  workflow_dispatch:

concurrency:
  group: post-bluesky
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  post:
    # Scheduled runs do nothing until the POSTING_ENABLED repo variable is "true", which doubles as a pause switch. Manual runs always post.
    if: vars.POSTING_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      # Scheduled posts drift within the hour, so they don't land at the same minute every day. Manual runs post right away.
      - name: Wait a random 0-59 minutes
        if: github.event_name == 'schedule'
        run: |
          delay=$((RANDOM % 3600))
          echo "Posting in $((delay / 60))m $((delay % 60))s."
          sleep "$delay"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun ci

      - name: Post to BlueSky
        run: bun run post:bluesky
        env:
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
